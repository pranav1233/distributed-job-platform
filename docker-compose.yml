name: jobplatform

x-app: &app
  build: .
  image: jobplatform:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://jobs:${POSTGRES_PASSWORD:-jobs}@postgres:5432/jobs
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LEASE_SECONDS: ${LEASE_SECONDS:-30}
    HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-10}
    REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-2}
    RELAY_POLL_INTERVAL_SECONDS: ${RELAY_POLL_INTERVAL_SECONDS:-0.05}
    RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-2}
    RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-300}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-32}
    WORKER_PREFETCH: ${WORKER_PREFETCH:-48}
    WORKER_CPU_PROCESSES: ${WORKER_CPU_PROCESSES:-2}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    DEFAULT_RATE_LIMIT_CAPACITY: ${DEFAULT_RATE_LIMIT_CAPACITY:-100}
    DEFAULT_RATE_LIMIT_REFILL_PER_SEC: ${DEFAULT_RATE_LIMIT_REFILL_PER_SEC:-50}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobs}
      POSTGRES_DB: jobs
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["python", "-m", "jobplatform.api"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "jobplatform.worker"]
    stop_grace_period: 40s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9101/metrics', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  relay:
    <<: *app
    command: ["python", "-m", "jobplatform.relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9102/metrics', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  reaper:
    <<: *app
    command: ["python", "-m", "jobplatform.reaper"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9103/metrics', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jobplatform.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  rabbitmqdata:
