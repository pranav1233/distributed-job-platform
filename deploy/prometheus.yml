global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Service discovery through Docker DNS finds every scaled worker replica.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101

  - job_name: relay
    static_configs:
      - targets: ["relay:9102"]

  - job_name: reaper
    static_configs:
      - targets: ["reaper:9103"]
