[project]
name = "jobplatform"
version = "0.1.0"
description = "Distributed job processing platform: FastAPI, PostgreSQL, RabbitMQ, Redis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Pranav Padmapada" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis[hiredis]>=5.2",
    "aio-pika>=9.4",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres,redis,rabbitmq]>=4.8",
    "fakeredis[lua]>=2.26",
    "hypothesis>=6.120",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobplatform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF", "PT"]
ignore = ["S101", "B008", "RUF012", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "B017", "PT011"]
"scripts/**" = ["S311", "S603", "S607", "S105", "S106"]
"migrations/**" = ["E501"]
"src/jobplatform/worker/handlers/**" = ["S311", "S324"]
"src/jobplatform/domain/backoff.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/jobplatform", "scripts"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need real Postgres, Redis and RabbitMQ",
]
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.coverage.run]
source = ["src/jobplatform"]
branch = true
omit = ["src/jobplatform/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
